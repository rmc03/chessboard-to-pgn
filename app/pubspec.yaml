name: chessboard_pgn
description: "Chess diagram image to PGN, 100% on-device (simple test app)."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.14.0

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  image: ^4.12.0
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
  fonts:
    - family: ChessFigures
      fonts:
        - asset: assets/fonts/ChessFigures.ttf
