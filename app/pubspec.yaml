name: chessboard_pgn
description: "Chess diagram image to PGN, 100% on-device (simple test app)."
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: ^3.14.0

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  hugeicons: ^4.4.0
  image: ^4.12.0
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/pieces/
    - assets/pieces/merida/
    - assets/pieces/cburnett/
    - assets/pieces/chessnut/
    - assets/pieces/mpchess/
    - assets/pieces/celtic/
    - assets/licenses/
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-Barlow.txt
    - assets/fonts/LICENSE-DejaVu.txt
  fonts:
    - family: ChessFigures
      fonts:
        - asset: assets/fonts/ChessFigures.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
